name: pampeliska

# Veřejný provoz obstarává sdílený Caddy (compose Invoiceru) přes externí síť "edge" – viz docs/vps-setup.md.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pampeliska
      POSTGRES_USER: pampeliska
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?chybí POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pampeliska -d pampeliska"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pampeliska-app:latest
    container_name: pampeliska-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Database=pampeliska;Username=pampeliska;Password=${POSTGRES_PASSWORD}
      Auth__OwnerEmails: ${OWNER_EMAILS:-v.nadrasky@gmail.com}
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:?chybí GOOGLE_CLIENT_ID}
      Auth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?chybí GOOGLE_CLIENT_SECRET}
      Backup__Token: ${BACKUP_TOKEN:?chybí BACKUP_TOKEN}
      # Příjem e-mailů z bank (MX záznam domény míří na VPS) – viz docs/email-notifikace.md
      Email__Enabled: ${EMAIL_ENABLED:-true}
      Email__Domain: ${DOMAIN:-pampeliska.nadrasky.cz}
      Email__Port: 2525
      Email__CertificatePath: /certs/cert.pem
      Email__CertificateKeyPath: /certs/key.pem
      TZ: Europe/Prague
    ports:
      # Kontejner běží jako neprivilegovaný uživatel, port 25 neotevře – SMTP poslouchá na 2525
      - "25:2525"
    volumes:
      - appdata:/data
      - mailcerts:/certs:ro
    networks:
      - default
      - edge

  # Kopíruje certifikát, který pro doménu spravuje sdílený Caddy, pro STARTTLS příjmu e-mailů.
  # Caddy klíče ukládá jen pro roota, aplikace běží jako "app" – proto kopie s právem čtení do svazku mailcerts.
  certsync:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-pampeliska.nadrasky.cz}
    volumes:
      - caddy_data:/caddy:ro
      - mailcerts:/certs
    command:
      - sh
      - -c
      - |
        while true; do
          src=$$(ls -d /caddy/caddy/certificates/*/"$$DOMAIN" 2>/dev/null | head -1)
          if [ -n "$$src" ]; then
            cmp -s "$$src/$$DOMAIN.crt" /certs/cert.pem || { cp "$$src/$$DOMAIN.key" /certs/key.pem; cp "$$src/$$DOMAIN.crt" /certs/cert.pem; echo "certifikát zkopírován"; }
            chmod 644 /certs/cert.pem /certs/key.pem
          else
            echo "certifikát pro $$DOMAIN v datech Caddy zatím není"
          fi
          sleep 21600
        done

  backup:
    build: ./backup
    image: pampeliska-backup:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: pampeliska
      PGUSER: pampeliska
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-onedrive-crypt:pampeliska/}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-45 2 * * *}
      BACKUP_TOKEN: ${BACKUP_TOKEN}
      REPORT_URL: http://app:8080/internal/backup-report
      TZ: Europe/Prague
    volumes:
      - appdata:/data
      - ${RCLONE_CONFIG_DIR:-/opt/invoicer/rclone}:/config/rclone

volumes:
  pgdata:
  appdata:
  mailcerts:
  # Data sdíleného Caddy z compose Invoiceru (certifikáty) – jen pro čtení v certsync
  caddy_data:
    external: true
    name: ${CADDY_DATA_VOLUME:-invoicer_caddy_data}

networks:
  edge:
    external: true
